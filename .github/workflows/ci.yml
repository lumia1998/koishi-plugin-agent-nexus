name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: node node_modules/typescript/bin/tsc -p client/tsconfig.json --noEmit --pretty false
      - run: npm run build
      - run: npm pack --dry-run --json
      - run: npm audit --omit=dev --audit-level=high
